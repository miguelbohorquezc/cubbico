<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ========================================
         SECURITY HEADERS
         Protección contra XSS, clickjacking, y otras vulnerabilidades
         ======================================== -->

    <!-- Content Security Policy: Define fuentes permitidas de contenido -->
    <meta http-equiv="Content-Security-Policy"
          content="
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googleapis.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' https://images.pexels.com data: https:;
            connect-src 'self'
                        https://*.firebaseapp.com
                        https://*.googleapis.com
                        https://*.firebaseio.com
                        https://identitytoolkit.googleapis.com;
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
            upgrade-insecure-requests;
          ">

    <!-- X-Frame-Options: Previene clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY">

    <!-- X-Content-Type-Options: Previene MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- Referrer-Policy: Controla qué información se envía en el header Referrer -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

    <!-- Viewport para responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ========================================
         PWA META TAGS
         Configuración para Progressive Web App
         ======================================== -->

    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#1A3C57" />

    <!-- Description for PWA -->
    <meta name="description" content="Sistema académico integral para Colina Campestre School - Gestión de estudiantes, notas, reportes y más." />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cubbico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icon-192x192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Google Fonts Preconnect (performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <title>Sistema Institucional Académico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
